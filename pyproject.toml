[project]
name = "picolay"
version = "0.1.1"
description = "A tiny flexbox-style layout engine that renders to Pillow images (built for e-ink frames)"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picolay = ["*.ttf"]
